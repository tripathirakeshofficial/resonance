<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Resonance</title>
  <desc id="desc">
    Abstract R-shaped AI voice waveform logo for the Resonance voice changer and generation app.
  </desc>

  <defs>
    <linearGradient id="resonanceGradient" x1="70" y1="90" x2="440" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="waveGradient" x1="95" y1="256" x2="417" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472D0"/>
    </linearGradient>
  </defs>

